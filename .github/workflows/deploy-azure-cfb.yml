name: Deploy CFB Predictor to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - '**'

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push CFB Predictor image
        run: |
          docker build -t ghcr.io/kevocado/cfb-predictor:${{ github.sha }} -t ghcr.io/kevocado/cfb-predictor:latest .
          docker push ghcr.io/kevocado/cfb-predictor:${{ github.sha }}
          docker push ghcr.io/kevocado/cfb-predictor:latest

      - name: Log in to Azure
        run: |
          az login --service-principal -u "${{ secrets.AZURE_CLIENT_ID }}" -p "${{ secrets.AZURE_CLIENT_SECRET }}" --tenant "${{ secrets.AZURE_TENANT_ID }}"
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Create / Update CFB Predictor Container App
        run: |
          az containerapp create \
            --name cfb-predictor \
            --resource-group predictor-hub-rg \
            --environment proudbay-f56b8dfa.eastus2 \
            --image ghcr.io/kevocado/cfb-predictor:${{ github.sha }} \
            --target-port 8003 \
            --ingress external \
            --min-replicas 0 \
            --max-replicas 3 \
            --cpu 0.5 \
            --memory 1Gi \
            --env-vars PYTHONPATH=/app/src PUBLIC_MODE=true \
            --query properties.configuration.ingress.fqdn -o tsv 2>/dev/null || true

          az containerapp update \
            --name cfb-predictor \
            --resource-group predictor-hub-rg \
            --image ghcr.io/kevocado/cfb-predictor:${{ github.sha }} \
            --min-replicas 0 \
            --max-replicas 3 || true

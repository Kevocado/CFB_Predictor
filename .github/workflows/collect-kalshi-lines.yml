name: Collect Kalshi CFB game lines

# Free, public, no key: snapshots Kalshi's college football game, spread and total markets (the
# market's own lines) and the outcomes of recently settled ones into data/lines/*.jsonl.gz.
# Twice a day is enough to capture the opening line and the late line; the files are gzip and one
# per UTC day. Not a deploy trigger (data/** is not in deploy.yml's paths).

on:
  schedule:
    # 10:10am ET: the opening lines for the week's slate.
    - cron: "10 14 * * *"
    # 9:40pm ET the night before: the late lines, still before every kickoff.
    - cron: "40 01 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install requests
        run: pip install requests
      - name: Collect
        run: python -m cfb_predictor.data.kalshi_lines
        env:
          PYTHONPATH: src
      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain data/lines)" ]; then echo "nothing new"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lines
          git commit -m "Collect Kalshi CFB game lines [automated]"
          # A push that fails because someone else committed to main first is a normal
          # event on a shared branch, not a broken build: rebase onto the new main and
          # push again. Without this the job goes red every time two runs overlap.
          for attempt in 1 2 3 4; do
            git pull --rebase -q -X theirs && git push && exit 0
            echo "push attempt $attempt failed; retrying"; sleep $((attempt * 5))
          done
          exit 1

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cfb_predictor"
version = "0.1.0"
description = "College football (FBS) game outcome and player prop predictor"
requires-python = ">=3.10"
dependencies = [
    "cfbd>=5.0.0",
    "pandas",
    "pyarrow",
    "numpy",
    "scipy",
    "xgboost",
    "scikit-learn",
    "requests",
    "python-dotenv",
    # cfbd 5.x requires pydantic<2; fastapi>=0.120 dropped its pydantic v1
    # compat shim, so it must stay pinned below that to avoid a resolver
    # picking an incompatible pair (discovered in Task 17's real-env run).
    "pydantic<2,>=1.10.5",
    "fastapi<0.116",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]
